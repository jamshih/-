<svg xmlns="http://www.w3.org/2000/svg" width="430" height="900" viewBox="0 0 430 900" role="img" aria-labelledby="title desc"><title id="title">yoxi 隨行概念畫面 02：已同意的主動提醒</title><desc id="desc">出門再說 Team B 繪製，所有交通時間、價格、天氣與通知均為模擬，非正式品牌畫面。</desc><style>text{font-family:-apple-system,BlinkMacSystemFont,'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif}svg{background:#e8eeea}</style><rect x="4" y="4" width="422" height="892" rx="40" fill="#1c292d" stroke="none" stroke-width="1"/><rect x="12" y="12" width="406" height="876" rx="34" fill="#e2e8e3" stroke="none" stroke-width="1"/><rect x="168" y="12" width="94" height="24" rx="0" fill="#1c292d" stroke="none" stroke-width="1"/><text x="37" y="45" font-size="14" fill="#26352f" font-weight="800" text-anchor="start">9:41</text><text x="355" y="45" font-size="13" fill="#26352f" font-weight="800" text-anchor="start">●●  ▰</text><rect x="12" y="58" width="406" height="64" rx="0" fill="#ffffff" stroke="none" stroke-width="1"/><rect x="30" y="75" width="31" height="31" rx="11" fill="#d9ebe3" stroke="none" stroke-width="1"/><text x="45" y="97" font-size="18" fill="#2d6960" font-weight="700" text-anchor="middle">✦</text><text x="70" y="97" font-size="18" fill="#23322f" font-weight="800" text-anchor="start">隨行</text><text x="115" y="96" font-size="12" fill="#73837c" font-weight="400" text-anchor="start">概念版</text><rect x="314" y="80" width="85" height="25" rx="13" fill="#eef3ef" stroke="none" stroke-width="1"/><text x="356" y="97" font-size="11" fill="#65766d" font-weight="650" text-anchor="middle">[模擬] DEMO</text><rect x="12" y="122" width="406" height="740" rx="0" fill="#e2e8e3" stroke="none" stroke-width="1"/><text x="215" y="171" font-size="16" fill="#52685e" font-weight="600" text-anchor="middle">10 月 9 日 · 星期五 · 模擬鎖定畫面</text><text x="215" y="275" font-size="88" fill="#263b35" font-weight="650" text-anchor="middle">18:02</text><rect x="76" y="339" width="278" height="40" rx="20" fill="#f3f9f3" stroke="none" stroke-width="1"/><text x="215" y="364" font-size="13" fill="#2f685d" font-weight="700" text-anchor="middle">✓ 情境提醒：使用者已同意（示意）</text><rect x="29" y="411" width="372" height="237" rx="23" fill="#ffffff" stroke="#e2e9e3" stroke-width="1"/><text x="49" y="445" font-size="14" fill="#2c5f56" font-weight="800" text-anchor="start">✦ 隨行  ·  出行提醒</text><text x="365" y="445" font-size="12" fill="#7a8880" font-weight="400" text-anchor="start">現在</text><text x="49" y="493" font-size="19" fill="#283b34" font-weight="780" text-anchor="start">18:30 高雄巨蛋</text><text x="49" y="524" font-size="19" fill="#283b34" font-weight="780" text-anchor="start">該準備出門了</text><text x="49" y="557" font-size="14" fill="#55655d" font-weight="400" text-anchor="start">預計 18:30 抵達高雄巨蛋</text><text x="49" y="580" font-size="14" fill="#55655d" font-weight="400" text-anchor="start">（捷運巨蛋站）。情境顯示可能下雨，</text><text x="49" y="603" font-size="14" fill="#55655d" font-weight="400" text-anchor="start">要比較捷運和 yoxi 嗎？</text><text x="49" y="630" font-size="12" fill="#a25b4b" font-weight="750" text-anchor="start">[模擬] 天氣／行事曆／路況</text><rect x="29" y="677" width="372" height="58" rx="16" fill="#253b35" stroke="none" stroke-width="1"/><text x="215" y="713" font-size="15" fill="#ffffff" font-weight="760" text-anchor="middle">點開通知 · 接續同一段對話 →</text><text x="215" y="766" font-size="12" fill="#73847b" font-weight="500" text-anchor="middle">不是實際系統通知，也沒有使用者資料</text><text x="215" y="869" font-size="10" fill="#778780" font-weight="500" text-anchor="middle">出門再說 · 和泰 AI 黑客松 · 純概念原型</text></svg>