<svg xmlns="http://www.w3.org/2000/svg" width="430" height="900" viewBox="0 0 430 900" role="img" aria-labelledby="title desc"><title id="title">yoxi 隨行概念畫面 03：同一段對話與交通比較</title><desc id="desc">出門再說 Team B 繪製，所有交通時間、價格、天氣與通知均為模擬，非正式品牌畫面。</desc><style>text{font-family:-apple-system,BlinkMacSystemFont,'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif}svg{background:#e8eeea}</style><rect x="4" y="4" width="422" height="892" rx="40" fill="#1c292d" stroke="none" stroke-width="1"/><rect x="12" y="12" width="406" height="876" rx="34" fill="#f8f8f4" stroke="none" stroke-width="1"/><rect x="168" y="12" width="94" height="24" rx="0" fill="#1c292d" stroke="none" stroke-width="1"/><text x="37" y="45" font-size="14" fill="#26352f" font-weight="800" text-anchor="start">9:41</text><text x="355" y="45" font-size="13" fill="#26352f" font-weight="800" text-anchor="start">●●  ▰</text><rect x="12" y="58" width="406" height="64" rx="0" fill="#ffffff" stroke="none" stroke-width="1"/><rect x="30" y="75" width="31" height="31" rx="11" fill="#d9ebe3" stroke="none" stroke-width="1"/><text x="45" y="97" font-size="18" fill="#2d6960" font-weight="700" text-anchor="middle">✦</text><text x="70" y="97" font-size="18" fill="#23322f" font-weight="800" text-anchor="start">隨行</text><text x="115" y="96" font-size="12" fill="#73837c" font-weight="400" text-anchor="start">概念版</text><rect x="314" y="80" width="85" height="25" rx="13" fill="#eef3ef" stroke="none" stroke-width="1"/><text x="356" y="97" font-size="11" fill="#65766d" font-weight="650" text-anchor="middle">[模擬] DEMO</text><text x="215" y="154" font-size="12" fill="#74827b" font-weight="600" text-anchor="middle">今天 · 通知直接成為這段對話的第一句</text><rect x="26" y="181" width="346" height="124" rx="18" fill="#e8f2ea" stroke="#d0e4d8" stroke-width="1"/><text x="42" y="208" font-size="14" fill="#286b65" font-weight="780" text-anchor="start">✦ 剛才的提醒</text><text x="42" y="236" font-size="13" fill="#26352f" font-weight="400" text-anchor="start">18:30 高雄巨蛋 · 該準備出門了。</text><text x="42" y="258" font-size="13" fill="#26352f" font-weight="400" text-anchor="start">可能下雨，步行轉乘記得帶傘。</text><text x="42" y="280" font-size="13" fill="#26352f" font-weight="400" text-anchor="start">要比較捷運和 yoxi 嗎？</text><rect x="26" y="320" width="358" height="76" rx="17" fill="#e8f2ea" stroke="none" stroke-width="1"/><text x="42" y="350" font-size="14" fill="#26352f" font-weight="400" text-anchor="start">我先比較兩種方式；想省錢的話，</text><text x="42" y="374" font-size="14" fill="#26352f" font-weight="400" text-anchor="start">捷運也很合理。以下都是情境示意。</text><text x="28" y="425" font-size="14" fill="#668174" font-weight="750" text-anchor="start">交通方式比較  ·  目的地：捷運巨蛋站</text><rect x="26" y="448" width="378" height="137" rx="19" fill="#ffffff" stroke="#dce6df" stroke-width="1"/><text x="44" y="477" font-size="17" fill="#253b35" font-weight="760" text-anchor="start">高雄捷運＋步行</text><rect x="310" y="457" width="75" height="27" rx="14" fill="#e8f3ed" stroke="none" stroke-width="1"/><text x="347.5" y="475" font-size="12" fill="#2d6960" font-weight="700" text-anchor="middle">較省錢</text><text x="44" y="526" font-size="24" fill="#23382f" font-weight="800" text-anchor="start">28 分鐘</text><text x="199" y="525" font-size="17" fill="#597167" font-weight="650" text-anchor="start">NT$35</text><text x="44" y="557" font-size="12" fill="#78837b" font-weight="400" text-anchor="start">步行約 7 分鐘 · 可能遇雨 · [模擬]</text><rect x="26" y="597" width="378" height="137" rx="19" fill="#ffffff" stroke="#dce6df" stroke-width="1"/><text x="44" y="626" font-size="17" fill="#253b35" font-weight="760" text-anchor="start">yoxi 叫車</text><rect x="292" y="606" width="95" height="27" rx="14" fill="#e8f3ed" stroke="none" stroke-width="1"/><text x="339.5" y="624" font-size="12" fill="#2d6960" font-weight="700" text-anchor="middle">步行較少</text><text x="44" y="675" font-size="24" fill="#23382f" font-weight="800" text-anchor="start">17 分鐘</text><text x="199" y="674" font-size="17" fill="#597167" font-weight="650" text-anchor="start">NT$240</text><text x="44" y="708" font-size="12" fill="#78837b" font-weight="400" text-anchor="start">實際車資與上車點應在原生畫面確認</text><text x="28" y="760" font-size="12" fill="#ad6451" font-weight="400" text-anchor="start">[模擬] ETA、票價、降雨皆非真實即時資料</text><rect x="26" y="782" width="225" height="55" rx="14" fill="#e7f1e9" stroke="none" stroke-width="1"/><text x="138" y="816" font-size="16" fill="#326354" font-weight="780" text-anchor="middle">我不想淋雨</text><rect x="260" y="782" width="144" height="55" rx="14" fill="#263b35" stroke="none" stroke-width="1"/><text x="332" y="816" font-size="15" fill="#ffffff" font-weight="750" text-anchor="middle">直接叫車</text><text x="215" y="869" font-size="10" fill="#778780" font-weight="500" text-anchor="middle">出門再說 · 和泰 AI 黑客松 · 純概念原型</text></svg>