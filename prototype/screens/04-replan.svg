<svg xmlns="http://www.w3.org/2000/svg" width="430" height="900" viewBox="0 0 430 900" role="img" aria-labelledby="title desc"><title id="title">yoxi 隨行概念畫面 04：改變偏好後的明確確認</title><desc id="desc">出門再說 Team B 繪製，所有交通時間、價格、天氣與通知均為模擬，非正式品牌畫面。</desc><style>text{font-family:-apple-system,BlinkMacSystemFont,'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif}svg{background:#e8eeea}</style><rect x="4" y="4" width="422" height="892" rx="40" fill="#1c292d" stroke="none" stroke-width="1"/><rect x="12" y="12" width="406" height="876" rx="34" fill="#f8f8f4" stroke="none" stroke-width="1"/><rect x="168" y="12" width="94" height="24" rx="0" fill="#1c292d" stroke="none" stroke-width="1"/><text x="37" y="45" font-size="14" fill="#26352f" font-weight="800" text-anchor="start">9:41</text><text x="355" y="45" font-size="13" fill="#26352f" font-weight="800" text-anchor="start">●●  ▰</text><rect x="12" y="58" width="406" height="64" rx="0" fill="#ffffff" stroke="none" stroke-width="1"/><rect x="30" y="75" width="31" height="31" rx="11" fill="#d9ebe3" stroke="none" stroke-width="1"/><text x="45" y="97" font-size="18" fill="#2d6960" font-weight="700" text-anchor="middle">✦</text><text x="70" y="97" font-size="18" fill="#23322f" font-weight="800" text-anchor="start">隨行</text><text x="115" y="96" font-size="12" fill="#73837c" font-weight="400" text-anchor="start">概念版</text><rect x="314" y="80" width="85" height="25" rx="13" fill="#eef3ef" stroke="none" stroke-width="1"/><text x="356" y="97" font-size="11" fill="#65766d" font-weight="650" text-anchor="middle">[模擬] DEMO</text><text x="215" y="150" font-size="12" fill="#74827b" font-weight="600" text-anchor="middle">今天 · 同一段對話延續</text><rect x="84" y="177" width="319" height="55" rx="18" fill="#243e38" stroke="none" stroke-width="1"/><text x="245" y="210" font-size="17" fill="#ffffff" font-weight="760" text-anchor="middle">我不想淋雨</text><rect x="26" y="249" width="359" height="88" rx="17" fill="#e8f2ea" stroke="none" stroke-width="1"/><text x="41" y="280" font-size="14" fill="#26352f" font-weight="400" text-anchor="start">了解，我會優先推薦少淋雨的方式，</text><text x="41" y="310" font-size="14" fill="#26352f" font-weight="400" text-anchor="start">但不會自動幫你叫車。你可以決定。</text><text x="28" y="371" font-size="13" fill="#668174" font-weight="760" text-anchor="start">依照新偏好重新排序  ·  全部 [模擬]</text><rect x="26" y="392" width="378" height="158" rx="19" fill="#ffffff" stroke="#dce6df" stroke-width="1"/><rect x="27" y="392" width="376" height="157" rx="18" fill="#f7fcf9" stroke="#b7d6c7" stroke-width="1"/><text x="44" y="429" font-size="18" fill="#253b35" font-weight="800" text-anchor="start">yoxi 叫車 · 少步行</text><rect x="285" y="407" width="100" height="27" rx="14" fill="#e8f3ed" stroke="none" stroke-width="1"/><text x="335" y="425" font-size="12" fill="#2d6960" font-weight="700" text-anchor="middle">符合偏好</text><text x="44" y="482" font-size="24" fill="#213932" font-weight="820" text-anchor="start">17 分鐘</text><text x="214" y="481" font-size="17" fill="#4b685e" font-weight="650" text-anchor="start">NT$240</text><text x="44" y="518" font-size="12" fill="#71827a" font-weight="400" text-anchor="start">實際車資／接送點須回正式叫車頁確認。</text><rect x="26" y="563" width="378" height="146" rx="19" fill="#ffffff" stroke="#dce6df" stroke-width="1"/><text x="44" y="597" font-size="17" fill="#253b35" font-weight="760" text-anchor="start">高雄捷運 · 更省錢</text><rect x="293" y="577" width="94" height="27" rx="14" fill="#e8f3ed" stroke="none" stroke-width="1"/><text x="340" y="595" font-size="12" fill="#2d6960" font-weight="700" text-anchor="middle">仍可選擇</text><text x="44" y="648" font-size="24" fill="#213932" font-weight="800" text-anchor="start">28 分鐘</text><text x="214" y="647" font-size="17" fill="#4b685e" font-weight="650" text-anchor="start">NT$35</text><text x="44" y="679" font-size="12" fill="#71827a" font-weight="400" text-anchor="start">約 7 分鐘步行 · 可能淋雨 · [模擬]</text><text x="29" y="745" font-size="13" fill="#a66452" font-weight="700" text-anchor="start">需要你的明確確認：沒有自動派車。</text><rect x="28" y="767" width="138" height="59" rx="15" fill="#e7f1e9" stroke="none" stroke-width="1"/><text x="97" y="804" font-size="15" fill="#2e6355" font-weight="750" text-anchor="middle">返回比較</text><rect x="175" y="767" width="227" height="59" rx="15" fill="#253b35" stroke="none" stroke-width="1"/><text x="288" y="804" font-size="16" fill="#ffffff" font-weight="760" text-anchor="middle">查看叫車確認 →</text><text x="215" y="869" font-size="10" fill="#778780" font-weight="500" text-anchor="middle">出門再說 · 和泰 AI 黑客松 · 純概念原型</text></svg>